<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e1621">
  <meta name="description" content="SweetChat - Anime AI Character Chat">
  <title>SweetChat — Anime Companion</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app-container">

  <header class="header">
    <div class="header-left">
      <button id="back-btn" class="icon-btn" aria-label="Back" hidden>←</button>

      <img id="char-avatar" class="avatar-img" alt="" hidden>

      <div class="header-user-info">
        <h3 id="header-title">SweetChat</h3>
        <span id="header-status" hidden></span>
      </div>
    </div>

    <div class="header-actions">
      <button id="edit-char-btn" class="subtle-btn" hidden>Edit</button>
      <button id="new-chat-btn" class="subtle-btn" hidden>New Chat</button>
    </div>
  </header>

  <!-- CHARACTER LIST -->
  <main id="chats-view" class="view-content active">

    <div class="section-heading">
      <div>
        <h2>Your Characters</h2>
        <p>Choose someone to talk with</p>
      </div>

      <button id="add-character-btn" class="primary-btn">
        ＋ Create
      </button>
    </div>

    <div id="character-cards-list" class="character-grid"></div>

  </main>

  <!-- PROFILE -->
  <main id="profile-view" class="view-content">

    <section class="panel">

      <h2>My Profile</h2>

      <div class="profile-avatar-wrapper">

        <img
          id="user-avatar-preview"
          class="profile-avatar-preview"
          alt="Profile preview"
        >

        <label class="upload-btn">
          📷 Change Photo
          <input
            type="file"
            id="user-avatar-input"
            accept="image/*"
            hidden
          >
        </label>

      </div>

      <label>
        Your Name
        <input
          id="user-name-input"
          maxlength="50"
          placeholder="Your name"
        >
      </label>

      <label>
        About You
        <textarea
          id="user-about-input"
          rows="4"
          maxlength="1000"
          placeholder="Interests, hobbies, things characters should know..."
        ></textarea>
      </label>

      <label>
        Gender
        <select id="user-gender-select">
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </label>

      <button id="save-profile-btn" class="primary-btn full">
        Save Profile
      </button>

    </section>

  </main>

  <!-- SETTINGS -->
  <main id="settings-view" class="view-content">

    <section class="panel">

      <h2>Settings</h2>

      <label>
        OpenRouter API Key
        <input
          type="password"
          id="api-key-input"
          autocomplete="off"
          placeholder="sk-or-..."
        >
      </label>

      <p class="hint">
        API Key ကို ဒီ Browser ရဲ့ localStorage ထဲမှာ သိမ်းပါတယ်။
        Shared/Public Device မှာ မသိမ်းပါနဲ့။
      </p>

      <button id="save-key-btn" class="primary-btn full">
        Save API Key
      </button>

      <label>
        AI Model
        <select id="model-select"></select>
      </label>

      <p class="hint">
        Free model availability နဲ့ rate limits က အချိန်အလိုက်
        ပြောင်းလဲနိုင်ပါတယ်။
      </p>

      <button id="refresh-models-btn" class="secondary-btn full">
        Refresh Free Models
      </button>

    </section>

  </main>

  <!-- CHAT SCREEN -->
  <section id="chat-screen-view" class="chat-screen">

    <div
      id="chat-box"
      class="chat-box"
      aria-live="polite"
    ></div>

    <footer class="input-area">

      <input
        type="text"
        id="chat-input"
        placeholder="Message..."
        maxlength="4000"
        autocomplete="off"
      >

      <button id="send-btn" class="primary-btn">
        Send
      </button>

    </footer>

  </section>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav" id="bottom-nav">

    <button
      class="nav-item active"
      data-tab="chats-view"
    >
      <span>💬</span>
      Chats
    </button>

    <button
      class="nav-item"
      data-tab="profile-view"
    >
      <span>👤</span>
      Profile
    </button>

    <button
      class="nav-item"
      data-tab="settings-view"
    >
      <span>⚙️</span>
      Settings
    </button>

  </nav>

</div>

<!-- CHARACTER EDITOR -->
<dialog id="character-dialog" class="editor-dialog">

  <form id="character-form" method="dialog">

    <div class="dialog-head">

      <h2 id="character-dialog-title">
        Create Character
      </h2>

      <button
        type="button"
        id="close-character-dialog"
        class="icon-btn"
      >
        ✕
      </button>

    </div>

    <input
      type="hidden"
      id="character-id"
    >

    <label>
      Character Name
      <input
        id="character-name"
        required
        maxlength="50"
        placeholder="Name"
      >
    </label>

    <label>
      Avatar Image
      <input
        id="character-avatar-file"
        type="file"
        accept="image/*"
      >
    </label>

    <label>
      Avatar URL (optional)
      <input
        id="character-avatar-url"
        maxlength="500"
        placeholder="./avatar.png or https://..."
      >
    </label>

    <label>
      Personality
      <textarea
        id="character-personality"
        required
        rows="3"
        maxlength="1500"
        placeholder="Personality, likes, dislikes..."
      ></textarea>
    </label>

    <label>
      Speaking Style
      <textarea
        id="character-style"
        rows="2"
        maxlength="700"
        placeholder="How should the character speak?"
      ></textarea>
    </label>

    <label>
      System Prompt
      <textarea
        id="character-prompt"
        rows="4"
        maxlength="3000"
        placeholder="Roleplay instructions"
      ></textarea>
    </label>

    <label>
      First Greeting
      <input
        id="character-greeting"
        maxlength="500"
        placeholder="Hello!"
      >
    </label>

    <label>
      Memory / Important Facts
      <textarea
        id="character-memory"
        rows="3"
        maxlength="2000"
        placeholder="Things this character should remember"
      ></textarea>
    </label>

    <div class="dialog-actions">

      <button
        type="button"
        id="delete-character-btn"
        class="danger-btn"
        hidden
      >
        Delete
      </button>

      <button
        type="submit"
        class="primary-btn"
      >
        Save Character
      </button>

    </div>

  </form>

</dialog>

<script type="module" src="app.js"></script>

</body>
</html>

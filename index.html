<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SweetChat</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2e;
      --accent-color: #ff3b68;
      --accent-hover: #e02e55;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #1e293b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .app-container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg-color);
    }

    /* Header */
    .header {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-color);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: #ffffff;
      margin: 0;
    }
    .icon-btn {
      background: #1e293b;
      border: none;
      color: #94a3b8;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 1px;
      margin: 12px 16px 4px 16px;
      text-transform: uppercase;
    }

    /* Home View */
    .home-container {
      padding: 12px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 80px;
    }

    .char-card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid var(--border-color);
    }
    .card-top {
      display: flex;
      gap: 14px;
    }
    .card-avatar {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: cover;
    }
    .card-meta {
      flex: 1;
    }
    .char-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }
    .char-name {
      font-size: 1.15rem;
      font-weight: bold;
      margin: 0;
      color: #ffffff;
    }
    .char-badge {
      color: #ef4444;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .char-relation {
      color: #ff3b68;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .char-desc {
      font-size: 0.85rem;
      color: var(--text-sub);
      line-height: 1.4;
      margin: 0;
    }

    .card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 4px;
    }
    .btn-chat {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 24px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* Settings Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      width: 85%;
      max-width: 360px;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }
    .modal-input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #0b0f19;
      color: white;
      margin: 10px 0 16px 0;
      outline: none;
    }

    /* Chat View */
    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 80px;
    }
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: var(--accent-color);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.model {
      align-self: flex-start;
      background: #ffffff;
      color: #0f172a;
      border-bottom-left-radius: 4px;
    }

    /* Typing Indicator */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
      background: #ffffff !important;
    }
    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--accent-color);
      border-radius: 50%;
      animation: typing 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typing {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      padding: 12px;
      background: var(--bg-color);
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border-color);
    }
    .input-area input {
      flex: 1;
      background: #1e293b;
      border: none;
      padding: 12px 16px;
      border-radius: 20px;
      color: white;
      outline: none;
    }
    .input-area button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="header-left">
        <button id="back-btn" class="icon-btn" style="display: none;">←</button>
        <h2 class="brand-title" id="header-title">SweetChat</h2>
      </div>
      <button id="settings-btn" class="icon-btn">⚙️</button>
    </header>

    <div id="home-view">
      <div class="section-title">OFFICIAL COMPANIONS</div>
      <div id="character-cards-list" class="home-container"></div>
    </div>

    <main id="chat-box" class="chat-box" style="display: none;"></main>

    <footer id="input-area" class="input-area" style="display: none;">
      <input type="text" id="chat-input" placeholder="စကားပြောရန် စာရိုက်ပါ..." />
      <button id="send-btn">ပို့မည်</button>
    </footer>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0;">OpenRouter API Settings</h3>
      <label style="font-size: 0.85rem; color: var(--text-sub);">OpenRouter API Key ထည့်ပါ -</label>
      <input type="password" id="api-key-input" class="modal-input" placeholder="sk-or-v1-..." />
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button id="close-modal-btn" style="background: transparent; border: none; color: #94a3b8; cursor: pointer;">Cancel</button>
        <button id="save-key-btn" style="background: var(--accent-color); color: white; border: none; padding: 6px 16px; border-radius: 8px; cursor: pointer;">Save</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
        </html>

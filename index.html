<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SweetChat - Anime Character AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="chat-header">
    <button id="back-btn" class="back-btn" aria-label="Back">
      &#8592;
    </button>

    <div class="header-character">
      <img
        id="header-avatar"
        src=""
        alt="Character"
      >

      <div class="header-info">
        <h2 id="header-name">SweetChat</h2>
        <span id="header-status">Online</span>
      </div>
    </div>

    <button id="new-chat-btn" aria-label="New chat">
      &#43;
    </button>
  </header>


  <!-- MAIN CONTENT -->
  <main>

    <!-- CHATS VIEW -->
    <section id="chats-view" class="view active">

      <div class="character-cards-list" id="character-cards-list">
        <!-- Character cards generated by app.js -->
      </div>

    </section>


    <!-- PROFILE VIEW -->
    <section id="profile-view" class="view">

      <div class="profile-container">

        <div class="profile-avatar-container">
          <img
            id="profile-avatar"
            src=""
            alt="Profile"
          >
        </div>

        <div class="form-group">
          <label for="profile-name-input">
            Your Name
          </label>

          <input
            type="text"
            id="profile-name-input"
            placeholder="Enter your name"
          >
        </div>

        <div class="form-group">
          <label for="profile-about-input">
            About You
          </label>

          <textarea
            id="profile-about-input"
            placeholder="Tell us about yourself..."
          ></textarea>
        </div>

        <div class="form-group">
          <label for="profile-gender-select">
            Gender
          </label>

          <select id="profile-gender-select">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <button id="save-profile-btn">
          Save Profile
        </button>

      </div>

    </section>


    <!-- SETTINGS VIEW -->
    <section id="settings-view" class="view">

      <div class="settings-container">

        <!-- GEMINI API KEY -->
        <div class="form-group">

          <label for="api-key-input">
            Google Gemini API Key
          </label>

          <input
            type="password"
            id="api-key-input"
            placeholder="Enter your Gemini API Key"
            autocomplete="off"
          >

          <button id="save-key-btn">
            Save API Key
          </button>

        </div>


        <!-- MODEL SELECTION -->
        <div class="form-group">

          <label for="model-select">
            Gemini AI Model
          </label>

          <select id="model-select">

            <option value="gemini-3.8-flash">
              Gemini 3.8 Flash
            </option>

            <option value="gemini-3.7-flash">
              Gemini 3.7 Flash
            </option>

            <option value="gemini-3.6-flash">
              Gemini 3.6 Flash
            </option>

            <option value="gemini-3.5-flash">
              Gemini 3.5 Flash
            </option>

            <option value="gemini-3.5-flash-lite">
              Gemini 3.5 Flash Lite
            </option>

            <option value="gemini-3.1-flash-lite">
              Gemini 3.1 Flash Lite
            </option>

          </select>

        </div>

      </div>

    </section>


    <!-- CHAT SCREEN -->
    <section id="chat-screen-view" class="view">

      <div id="chat-box" class="chat-box">
        <!-- Messages generated by app.js -->
      </div>

      <div class="chat-input-container">

        <textarea
          id="chat-input"
          placeholder="Type a message..."
          rows="1"
        ></textarea>

        <button id="send-btn">
          Send
        </button>

      </div>

    </section>

  </main>


  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">

    <button
      id="nav-chats"
      class="nav-btn active"
      data-view="chats"
    >
      Chats
    </button>

    <button
      id="nav-profile"
      class="nav-btn"
      data-view="profile"
    >
      Profile
    </button>

    <button
      id="nav-settings"
      class="nav-btn"
      data-view="settings"
    >
      Settings
    </button>

  </nav>


  <!-- APP SCRIPT -->
  <script type="module" src="app.js"></script>

</body>
  </html>

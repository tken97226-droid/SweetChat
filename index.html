<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SweetChat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0e1621; color: #fff; height: 100vh; display: flex; flex-direction: column; }
    
    .app-container { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    
    /* Header */
    .header { background: #17212b; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #232e3c; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .btn-back { background: transparent; border: none; color: #64b5ef; font-size: 1.2rem; cursor: pointer; }
    .btn-new-chat { background: #e53935; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    
    /* Views */
    .view-content { flex: 1; overflow-y: auto; display: none; flex-direction: column; padding-bottom: 60px; }
    .view-content.active { display: flex; }

    /* Telegram Style Chat List (Chats Tab) */
    .chat-list-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #17212b; cursor: pointer; }
    .chat-list-item:active { background-color: #17212b; }
    .chat-list-item img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    .chat-info { flex: 1; }
    .chat-info-top { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .chat-info h3 { font-size: 1rem; color: #fff; }
    .chat-last-msg { font-size: 0.85rem; color: #7f91a4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .badge { background: #2b5278; color: #64b5ef; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; }

    /* Chat Screen Inner */
    .chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #0e1621; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
    .message.user { align-self: flex-end; background: #2b5278; color: #fff; border-bottom-right-radius: 2px; }
    .message.model { align-self: flex-start; background: #182533; color: #fff; border-bottom-left-radius: 2px; }
    
    .input-area { background: #17212b; padding: 10px; display: flex; gap: 8px; align-items: center; }
    .input-area input { flex: 1; background: #0e1621; border: 1px solid #232e3c; color: white; padding: 10px 14px; border-radius: 20px; outline: none; }
    .input-area button { background: #2b5278; color: #64b5ef; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }

    /* Settings Page */
    .settings-container { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .setting-group { background: #17212b; padding: 16px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; }
    .setting-group label { color: #64b5ef; font-size: 0.9rem; font-weight: bold; }
    .setting-group input, .setting-group select { background: #0e1621; border: 1px solid #232e3c; color: white; padding: 10px; border-radius: 6px; outline: none; }
    .btn-save { background: #2b5278; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }

    /* Bottom Navigation Bar */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 56px; background: #17212b; display: flex; justify-content: space-around; border-top: 1px solid #232e3c; }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #7f91a4; text-decoration: none; font-size: 0.75rem; flex: 1; cursor: pointer; gap: 2px; }
    .nav-item.active { color: #64b5ef; }
    .nav-icon { font-size: 1.2rem; }

    /* Typing Animation */
    .typing-indicator { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; }
    .typing-indicator span { width: 6px; height: 6px; background-color: #64b5ef; border-radius: 50%; animation: typingBounce 1.4s infinite ease-in-out; }
    .typing-indicator span:nth-child(1) { animation-delay: 0s; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-6px); opacity: 1; } }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Main Header -->
    <header class="header">
      <div class="header-left">
        <button id="back-btn" class="btn-back" style="display: none;">←</button>
        <img id="char-avatar" src="Susuki.jpeg" class="avatar-img" style="display: none;" />
        <h2 id="header-title">SweetChat</h2>
      </div>
      <div>
        <button id="new-chat-btn" class="btn-new-chat" style="display: none;">New Chat</button>
      </div>
    </header>

    <!-- Tab 1: Chats (Character List) -->
    <div id="chats-view" class="view-content active">
      <div id="character-cards-list"></div>
    </div>

    <!-- Tab 2: Settings (API Key & Model Selection) -->
    <div id="settings-view" class="view-content">
      <div class="settings-container">
        <h3>Settings</h3>
        <div class="setting-group">
          <label for="api-key-input">OpenRouter API Key</label>
          <input type="password" id="api-key-input" placeholder="Enter your API Key here" />
          <button id="save-key-btn" class="btn-save">Save Key</button>
        </div>
        <div class="setting-group">
          <label for="model-select">Select AI Model</label>
          <select id="model-select">
            <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option>
            <option value="meta-llama/llama-3.1-8b-instruct:free">Llama 3.1 8B (Free)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Chat Screen View -->
    <div id="chat-screen-view" class="view-content" style="padding-bottom: 0;">
      <div id="chat-box" class="chat-box"></div>
      <footer id="input-area" class="input-area">
        <input type="text" id="chat-input" placeholder="Message..." />
        <button id="send-btn">Send</button>
      </footer>
    </div>

    <!-- Telegram Bottom Navigation -->
    <nav class="bottom-nav" id="bottom-nav">
      <div class="nav-item active" data-tab="chats-view">
        <span class="nav-icon">💬</span>
        <span>Chats</span>
      </div>
      <div class="nav-item" data-tab="settings-view">
        <span class="nav-icon">⚙️</span>
        <span>Settings</span>
      </div>
    </nav>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SweetChat</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --accent-color: #ff477e;
      --accent-hover: #ff2a6d;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --chip-bg: #f1f5f9;
      --chip-text: #64748b;
      --border-color: #f1f5f9;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .app-container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #f8fafc;
    }

    /* Header */
    .header {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent-color);
      margin: 0;
    }
    .icon-btn {
      background: #f1f5f9;
      border: none;
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    /* Home UI (Companion Cards) */
    .home-container {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 80px;
    }

    .char-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      border: 1px solid var(--border-color);
    }
    .card-top {
      display: flex;
      gap: 12px;
    }
    .card-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
    }
    .card-meta {
      flex: 1;
    }
    .char-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .char-name {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .char-gender {
      color: var(--accent-color);
      font-size: 0.9rem;
    }
    .char-badge {
      background: #f1f5f9;
      color: #64748b;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .char-relation {
      color: var(--accent-color);
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .char-desc {
      font-size: 0.85rem;
      color: var(--text-sub);
      line-height: 1.4;
      margin: 0 0 10px 0;
    }

    /* Tags/Chips */
    .chips-container {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .chip {
      background: var(--chip-bg);
      color: var(--chip-text);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 12px;
    }

    /* Card Footer Buttons */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
      padding-top: 8px;
    }
    .btn-profile {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-chat {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(255, 71, 126, 0.3);
    }

    /* Settings Popup Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      width: 85%;
      max-width: 360px;
    }
    .modal-input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      box-sizing: border-box;
      margin: 8px 0 16px 0;
    }

    /* Chat View */
    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 80px;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .message.user {
      align-self: flex-end;
      background: var(--accent-color);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.model {
      align-self: flex-start;
      background: #ffffff;
      color: var(--text-main);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-color);
    }

    /* Typing Indicator Animation */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
    }
    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--accent-color);
      border-radius: 50%;
      animation: typing 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typing {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      padding: 12px;
      background: #ffffff;
      box-sizing: border-box;
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border-color);
    }
    .input-area input {
      flex: 1;
      background: #f1f5f9;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      outline: none;
    }
    .input-area button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="header-left">
        <button id="back-btn" class="icon-btn" style="display: none;">←</button>
        <h2 class="brand-title" id="header-title">SweetChat</h2>
      </div>
      <button id="settings-btn" class="icon-btn">⚙️</button>
    </header>

    <!-- Home Screen -->
    <div id="home-view" class="home-container">
      <div id="character-cards-list"></div>
    </div>

    <!-- Chat Box -->
    <main id="chat-box" class="chat-box" style="display: none;"></main>

    <!-- Input Footer -->
    <footer id="input-area" class="input-area" style="display: none;">
      <input type="text" id="chat-input" placeholder="စကားပြောရန် စာရိုက်ပါ..." />
      <button id="send-btn">ပို့မည်</button>
    </footer>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0;">ပြင်ဆင်ချက်များ</h3>
      <label style="font-size: 0.85rem; color: var(--text-sub);">API Key ထည့်သွင်းပါ -</label>
      <input type="password" id="api-key-input" class="modal-input" placeholder="Enter API Key" />
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button id="close-modal-btn" style="background: transparent; border: none; cursor: pointer;">မလုပ်တော့ပါ</button>
        <button id="save-key-btn" style="background: var(--accent-color); color: white; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer;">သိမ်းမည်</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
  </html>

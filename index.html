<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SweetChat</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #151e32;
      --accent-color: #f43f5e;
      --accent-hover: #e11d48;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --chip-bg: #1e293b;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .app-container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Header Design */
    .header {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }
    .brand-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 0;
    }
    .icon-btn {
      background: #1e293b;
      border: none;
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    /* Home View (Companion Cards) */
    .home-container {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 80px;
    }
    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-sub);
      text-transform: uppercase;
      margin: 8px 0 4px 0;
    }

    .char-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      border: 1px solid #1e293b;
    }
    .card-top {
      display: flex;
      gap: 14px;
    }
    .card-avatar {
      width: 65px;
      height: 65px;
      border-radius: 18px;
      object-fit: cover;
    }
    .card-meta {
      flex: 1;
    }
    .char-name {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 0 0 4px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .char-badge {
      background: #2a1524;
      color: #f43f5e;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .char-relation {
      color: #f43f5e;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .char-desc {
      font-size: 0.85rem;
      color: var(--text-sub);
      line-height: 1.35;
      margin: 0;
    }
    .card-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 4px;
    }
    .btn-chat {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 60px;
      background: #0f172a;
      border-top: 1px solid #1e293b;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .nav-item {
      background: none;
      border: none;
      color: var(--text-sub);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.75rem;
      gap: 3px;
      cursor: pointer;
    }
    .nav-item.active {
      color: var(--accent-color);
    }

    /* Settings Modal Popup */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      width: 85%;
      max-width: 360px;
      border: 1px solid #1e293b;
    }
    .modal-content h3 {
      margin-top: 0;
    }
    .modal-input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      background: #0b1120;
      color: white;
      box-sizing: border-box;
      margin-top: 8px;
      margin-bottom: 16px;
    }

    /* Chat View */
    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 80px;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .message.user {
      align-self: flex-end;
      background: var(--accent-color);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.model {
      align-self: flex-start;
      background: #1e293b;
      color: var(--text-main);
      border-bottom-left-radius: 4px;
    }

    /* Messenger Typing Indicator Animation */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
    }
    .typing-dot {
      width: 7px;
      height: 7px;
      background: var(--text-sub);
      border-radius: 50%;
      animation: typing 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typing {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      padding: 12px;
      background: #0f172a;
      box-sizing: border-box;
      display: flex;
      gap: 8px;
      border-top: 1px solid #1e293b;
    }
    .input-area input {
      flex: 1;
      background: #1e293b;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      color: white;
      outline: none;
    }
    .input-area button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 0 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="header-left">
        <button id="back-btn" class="icon-btn" style="display: none;">←</button>
        <h2 class="brand-title" id="header-title">SweetChat</h2>
      </div>
      <button id="settings-btn" class="icon-btn">⚙️</button>
    </header>

    <!-- Home View -->
    <div id="home-view" class="home-container">
      <div class="section-title">OFFICIAL COMPANIONS</div>
      <div id="character-cards-list"></div>
    </div>

    <!-- Chat View -->
    <main id="chat-box" class="chat-box" style="display: none;"></main>

    <!-- Input Box -->
    <footer id="input-area" class="input-area" style="display: none;">
      <input type="text" id="chat-input" placeholder="စကားပြောရန် စာရိုက်ပါ..." />
      <button id="send-btn">Send</button>
    </footer>

    <!-- Bottom Nav -->
    <nav id="bottom-nav" class="bottom-nav">
      <button class="nav-item active">🏠 Home</button>
      <button id="nav-new-chat" class="nav-item">💬 New Chat</button>
    </nav>
  </div>

  <!-- Settings Modal Popup -->
  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <h3>Settings</h3>
      <label style="font-size: 0.85rem; color: var(--text-sub);">API Key ထည့်သွင်းပါ -</label>
      <input type="password" id="api-key-input" class="modal-input" placeholder="Enter API Key" />
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button id="close-modal-btn" style="background: transparent; border: none; color: white; cursor: pointer;">Cancel</button>
        <button id="save-key-btn" class="btn-chat">Save</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
  </html>

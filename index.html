<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SweetChat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #ffffff; display: flex; justify-content: center; height: 100vh; overflow: hidden; }

    /* Main Container */
    .app-container { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; background: #1e293b; position: relative; }

    /* Header */
    .app-header { height: 60px; background: #0f172a; display: flex; align-items: center; padding: 0 15px; border-bottom: 1px solid #334155; }
    .app-header h1 { font-size: 20px; font-weight: bold; color: #f8fafc; }

    /* Main Content Tabs */
    .app-content { flex: 1; overflow: hidden; position: relative; }
    .tab-view { display: none; height: 100%; overflow-y: auto; padding-bottom: 70px; }
    .tab-view.active { display: block; }

    /* Character List Item */
    .chat-list-item { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid #334155; cursor: pointer; transition: background 0.2s; }
    .chat-list-item:hover { background: #334155; }
    .chat-list-item img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-right: 15px; }
    .chat-info { flex: 1; overflow: hidden; }
    .chat-info-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .chat-info-top h3 { font-size: 16px; color: #f8fafc; }
    .badge { background: #3b82f6; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 10px; }
    .chat-last-msg { font-size: 13px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Full Chat Screen Overlay */
    #chat-screen-view { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 20; flex-direction: column; }
    #chat-screen-view.active { display: flex; }

    .chat-header { height: 60px; background: #1e293b; display: flex; align-items: center; padding: 0 15px; border-bottom: 1px solid #334155; }
    .chat-header img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; margin: 0 12px; }
    .chat-header-info { flex: 1; }
    .chat-header-info h3 { font-size: 16px; color: #fff; }
    .chat-header-info span { font-size: 12px; color: #3b82f6; }
    .icon-btn { background: none; border: none; color: #94a3b8; font-size: 18px; cursor: pointer; }

    /* Chat Messages Box */
    .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .chat-banner { width: 100%; max-height: 180px; object-fit: cover; border-radius: 12px; margin-bottom: 10px; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
    .message.model { background: #334155; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 4px; }
    .message.user { background: #3b82f6; color: #ffffff; align-self: flex-end; border-bottom-right-radius: 4px; }

    /* Chat Input Area */
    .chat-input-area { height: 65px; background: #1e293b; display: flex; align-items: center; padding: 10px 15px; gap: 10px; border-top: 1px solid #334155; }
    .chat-input-area input { flex: 1; height: 40px; background: #0f172a; border: 1px solid #334155; border-radius: 20px; padding: 0 15px; color: #fff; outline: none; }
    .send-btn { width: 40px; height: 40px; border-radius: 50%; background: #3b82f6; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* Profile & Settings Views */
    .form-container { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 14px; color: #94a3b8; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; outline: none; }
    .primary-btn { padding: 12px; background: #3b82f6; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; }

    /* Bottom Navigation */
    .bottom-nav { height: 60px; background: #1e293b; border-top: 1px solid #334155; display: flex; justify-content: space-around; align-items: center; position: absolute; bottom: 0; width: 100%; z-index: 10; }
    .nav-item { background: none; border: none; color: #94a3b8; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; }
    .nav-item.active { color: #3b82f6; }
    .nav-item i { font-size: 18px; }
  </style>
</head>
<body>

<div class="app-container">

  <!-- Header -->
  <header class="app-header" id="main-header">
    <h1 id="header-title">SweetChat</h1>
  </header>

  <!-- Content Views -->
  <main class="app-content">

    <!-- CHATS LIST TAB -->
    <section id="chats-view" class="tab-view active">
      <div id="character-list"></div>
    </section>

    <!-- PROFILE TAB -->
    <section id="profile-view" class="tab-view">
      <div class="form-container">
        <h2>My Profile</h2>
        <div class="form-group">
          <label>သင့်အမည်</label>
          <input type="text" id="user-name" placeholder="User Name" value="User">
        </div>
        <div class="form-group">
          <label>ကျား / မ</label>
          <select id="user-gender">
            <option value="Male">Male (အမျိုးသား)</option>
            <option value="Female">Female (အမျိုးသမီး)</option>
          </select>
        </div>
        <div class="form-group">
          <label>သင့်အကြောင်း (About You)</label>
          <textarea id="user-about" rows="3" placeholder="သင့်အကြောင်း နည်းနည်း ရေးပေးပါ..."></textarea>
        </div>
        <button class="primary-btn" onclick="saveProfile()">Profile သိမ်းမည်</button>
      </div>
    </section>

    <!-- SETTINGS TAB -->
    <section id="settings-view" class="tab-view">
      <div class="form-container">
        <h2>Settings</h2>
        <div class="form-group">
          <label>OpenRouter API Key</label>
          <input type="password" id="api-key-input" placeholder="sk-or-v1-xxxxxxxxxxxx">
        </div>
        <button class="primary-btn" onclick="saveApiKey()">API Key သိမ်းမည်</button>
      </div>
    </section>

    <!-- CHAT SCREEN VIEW (OVERLAY) -->
    <section id="chat-screen-view">
      <div class="chat-header">
        <button class="icon-btn" onclick="closeChat()"><i class="fas fa-arrow-left"></i></button>
        <img id="chat-header-avatar" src="" alt="Avatar">
        <div class="chat-header-info">
          <h3 id="chat-header-name">Character Name</h3>
          <span id="chat-header-status">Affection: 0</span>
        </div>
      </div>

      <div class="chat-messages" id="chat-messages-box">
        <img id="chat-banner-img" class="chat-banner" src="" alt="Character Image">
        <!-- Messages will render here -->
      </div>

      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="စကားပြောရန် စာရိုက်ပါ..." autocomplete="off">
        <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
      </div>
    </section>

  </main>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('chats-view', this)">
      <i class="fas fa-comments"></i>
      <span>Chats</span>
    </button>
    <button class="nav-item" onclick="switchTab('profile-view', this)">
      <i class="fas fa-user"></i>
      <span>Profile</span>
    </button>
    <button class="nav-item" onclick="switchTab('settings-view', this)">
      <i class="fas fa-cog"></i>
      <span>Settings</span>
    </button>
  </nav>

</div>

<script>
  // Character Data
  const characters = [
    { id: 'char-suzuki', name: 'Suzuki', avatar: './Susuki.jpeg', affection: 30, greeting: 'ဟေး! ဘာလုပ်နေလဲဟင်? ဒီနေ့ ရာသီဥတု လေးက တကယ် သာယာတယ်နော်!', messages: [] },
    { id: 'char-waguri', name: 'Waguri', avatar: './Waguri.jpeg', affection: 25, greeting: 'မင်္ဂလာပါရှင်... ဒီနေ့ မုန့်လေးတွေ ဖုတ်ထားလို့။ ခဏလောက် လာစားပါလားဟင်?', messages: [] },
    { id: 'char-alya', name: 'Alya', avatar: './alya.jpeg', affection: 20, greeting: 'တော်တော်ကြာပြီ။ ဘာဖြစ်လို့လဲ။ လွမ်းနေလို့လား။', messages: [] },
    { id: 'char-rem', name: 'Rem', avatar: './Rem.jpeg', affection: 15, greeting: 'မင်္ဂလာပါရှင်... ကျမ Rem ပါ။ ဒီနေ့ ဘာများ ခိုင်းစရာရှိပါသလဲရှင်?', messages: [] },
    { id: 'char-makima', name: 'Makima', avatar: './makima.jpeg', affection: 10, greeting: 'မင်္ဂလာပါ... ဘာကိစ္စနဲ့ လာခဲ့တာလဲဟင်?', messages: [] },
    { id: 'char-yor', name: 'Yor Forger', avatar: './Yor Forger.jpeg', affection: 15, greeting: 'အာ... မင်္ဂလာပါရှင်! ကျမ နာမည်က Yor Forger ပါ။ အဆင်ပြေရင် စကားခဏ ပြောလို့ ရမလားဟင်?', messages: [] },
    { id: 'char-mitsuri', name: 'Mitsuri Kanroji', avatar: './Mitsuri.jpeg', affection: 20, greeting: 'ဟယ်! မင်္ဂလာပါရှင်~ အခုလို စကားပြောရတာ တကယ် ဝမ်းသာတာပဲ!', messages: [] },
    { id: 'char-shinobu', name: 'Shinobu Kocho', avatar: './Shinobu.jpeg', affection: 15, greeting: 'မိုရှီ မိုရှ်~ အဆင်ပြေရဲ့လားရှင်? ကျမနဲ့ စကားပြောဖို့ လာတာလားဟင်?', messages: [] }
  ];

  let currentCharacter = null;

  // Initialize
  document.addEventListener('DOMContentLoaded', () => {
    renderCharacterList();
    loadSettings();
    
    document.getElementById('chat-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  });

  // Render Character List
  function renderCharacterList() {
    const listContainer = document.getElementById('character-list');
    listContainer.innerHTML = '';

    characters.forEach(char => {
      const lastMsg = char.messages.length > 0 ? char.messages[char.messages.length - 1].content : char.greeting;
      const item = document.createElement('div');
      item.className = 'chat-list-item';
      item.onclick = () => openChat(char);
      item.innerHTML = `
        <img src="${char.avatar}" alt="${char.name}" onerror="this.src='https://via.placeholder.com/50'">
        <div class="chat-info">
          <div class="chat-info-top">
            <h3>${char.name}</h3>
            <span class="badge">Affection: ${char.affection}</span>
          </div>
          <div class="chat-last-msg">${lastMsg}</div>
        </div>
      `;
      listContainer.appendChild(item);
    });
  }

  // Switch Bottom Navigation Tabs
  function switchTab(tabId, btnElement) {
    document.querySelectorAll('.tab-view').forEach(view => view.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));

    document.getElementById(tabId).classList.add('active');
    btnElement.classList.add('active');

    const headerTitle = document.getElementById('header-title');
    if (tabId === 'chats-view') headerTitle.innerText = 'SweetChat';
    if (tabId === 'profile-view') headerTitle.innerText = 'My Profile';
    if (tabId === 'settings-view') headerTitle.innerText = 'Settings';
  }

  // Open Chat Screen
  function openChat(character) {
    currentCharacter = character;
    document.getElementById('chat-header-name').innerText = character.name;
    document.getElementById('chat-header-avatar').src = character.avatar;
    document.getElementById('chat-banner-img').src = character.avatar;
    document.getElementById('chat-header-status').innerText = `Affection: ${character.affection}`;
    
    const chatScreen = document.getElementById('chat-screen-view');
    chatScreen.classList.add('active');

    if (character.messages.length === 0) {
      character.messages.push({ role: 'assistant', content: character.greeting });
    }

    renderMessages();
  }

  // Close Chat Screen
  function closeChat() {
    document.getElementById('chat-screen-view').classList.remove('active');
    currentCharacter = null;
    renderCharacterList();
  }

  // Render Messages
  function renderMessages() {
    const box = document.getElementById('chat-messages-box');
    const banner = document.getElementById('chat-banner-img');
    box.innerHTML = '';
    box.appendChild(banner);

    currentCharacter.messages.forEach(msg => {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${msg.role === 'user' ? 'user' : 'model'}`;
      msgDiv.innerText = msg.content;
      box.appendChild(msgDiv);
    });

    box.scrollTop = box.scrollHeight;
  }

  // Send Message Logic
  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text || !currentCharacter) return;

    const apiKey = localStorage.getItem('sweetchat_api_key');
    if (!apiKey) {
      alert('Settings ထဲတွင် OpenRouter API Key ကို အရင်ထည့်သွင်းပေးပါ!');
      return;
    }

    currentCharacter.messages.push({ role: 'user', content: text });
    input.value = '';
    renderMessages();

    try {
      const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: 'meta-llama/llama-3.3-70b-instruct:free',
          messages: [
            { role: 'system', content: `You are ${currentCharacter.name}. Speak in natural Burmese text chat style only.` },
            ...currentCharacter.messages.map(m => ({ role: m.role, content: m.content }))
          ]
        })
      });

      const data = await response.json();
      const reply = data.choices?.[0]?.message?.content || 'တုံ့ပြန်မှု မရရှိပါ။';

      currentCharacter.messages.push({ role: 'assistant', content: reply });
      renderMessages();
    } catch (e) {
      currentCharacter.messages.push({ role: 'assistant', content: 'Error: API ချိတ်ဆက်မှု မအောင်မြင်ပါ။' });
      renderMessages();
    }
  }

  // Settings & Profile Persistence
  function saveApiKey() {
    const key = document.getElementById('api-key-input').value.trim();
    localStorage.setItem('sweetchat_api_key', key);
    alert('API Key သိမ်းဆည်းပြီးပါပြီ!');
  }

  function saveProfile() {
    const name = document.getElementById('user-name').value;
    const gender = document.getElementById('user-gender').value;
    const about = document.getElementById('user-about').value;
    localStorage.setItem('sweetchat_user_profile', JSON.stringify({ name, gender, about }));
    alert('Profile အချက်အလက် သိမ်းဆည်းပြီးပါပြီ!');
  }

  function loadSettings() {
    const savedKey = localStorage.getItem('sweetchat_api_key');
    if (savedKey) document.getElementById('api-key-input').value = savedKey;

    const savedProfile = localStorage.getItem('sweetchat_user_profile');
    if (savedProfile) {
      const prof = JSON.parse(savedProfile);
      if (prof.name) document.getElementById('user-name').value = prof.name;
      if (prof.gender) document.getElementById('user-gender').value = prof.gender;
      if (prof.about) document.getElementById('user-about').value = prof.about;
    }
  }
</script>

</body>
      </html>

<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SweetChat</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <button id="back-btn" class="icon-btn" style="display: none;"><i class="fas fa-arrow-left"></i></button>
      <img id="char-avatar" class="header-avatar" src="" alt="Avatar" style="display: none;">
      <div class="header-info">
        <h1 id="header-title">SweetChat</h1>
        <span id="header-status" class="header-status" style="display: none;">Affection: 0</span>
      </div>
      <button id="new-chat-btn" class="icon-btn" style="display: none;"><i class="fas fa-rotate-right"></i></button>
    </header>

    <main class="app-content">
      <!-- Chats List View -->
      <section id="chats-view" class="tab-view active">
        <div id="character-cards-list" class="chat-list"></div>
      </section>

      <!-- Chat Screen View -->
      <section id="chat-screen-view" class="tab-view">
        <div id="chat-box" class="chat-messages"></div>
        <div class="chat-input-area">
          <input type="text" id="chat-input" placeholder="စကားပြောရန် စာရိုက်ပါ..." autocomplete="off">
          <button id="send-btn" class="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
      </section>

      <!-- Profile View -->
      <section id="profile-view" class="tab-view">
        <div class="profile-container">
          <div class="avatar-upload">
            <img id="user-avatar-preview" src="https://via.placeholder.com/90" alt="User Avatar">
            <label for="user-avatar-input" class="upload-btn"><i class="fas fa-camera"></i></label>
            <input type="file" id="user-avatar-input" accept="image/*" style="display:none;">
          </div>
          <div class="form-group">
            <label>သင့်အမည်</label>
            <input type="text" id="user-name-input" placeholder="Name">
          </div>
          <div class="form-group">
            <label>ကျား / မ</label>
            <select id="user-gender-select">
              <option value="Male">Male (အမျိုးသား)</option>
              <option value="Female">Female (အမျိုးသမီး)</option>
            </select>
          </div>
          <div class="form-group">
            <label>သင့်အကြောင်း (About You)</label>
            <textarea id="user-about-input" rows="3" placeholder="သင့်အကြောင်း နည်းနည်း ရေးပေးပါ..."></textarea>
          </div>
          <button id="save-profile-btn" class="primary-btn">Profile သိမ်းမည်</button>
        </div>
      </section>

      <!-- Settings View -->
      <section id="settings-view" class="tab-view">
        <div class="settings-container">
          <div class="form-group">
            <label>OpenRouter API Key</label>
            <input type="password" id="api-key-input" placeholder="sk-or-v1-...">
            <button id="save-key-btn" class="primary-btn mt-2">API Key သိမ်းမည်</button>
          </div>
          <div class="form-group">
            <label>AI Model ရွေးချယ်ပါ</label>
            <select id="model-select">
              <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B (Free - Recommended)</option>
              <option value="openrouter/free">OpenRouter Auto Free</option>
              <option value="qwen/qwen-2.5-coder-32b-instruct:free">Qwen 2.5 32B (Free)</option>
              <option value="meta-llama/llama-3.1-8b-instruct:free">Llama 3.1 8B (Free)</option>
            </select>
          </div>
        </div>
      </section>
    </main>

    <nav id="bottom-nav" class="bottom-nav">
      <button class="nav-item active" data-tab="chats-view">
        <i class="fas fa-comments"></i>
        <span>Chats</span>
      </button>
      <button class="nav-item" data-tab="profile-view">
        <i class="fas fa-user"></i>
        <span>Profile</span>
      </button>
      <button class="nav-item" data-tab="settings-view">
        <i class="fas fa-cog"></i>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <script type="module" src="app.js"></script>
</body>
  </html>

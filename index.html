<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SweetChat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <button id="back-btn" class="btn-back" style="display: none;">←</button>
        <img id="char-avatar" src="" class="avatar-img" style="display: none;" />
        <div class="header-user-info">
          <h3 id="header-title">SweetChat</h3>
          <span id="header-status" style="display: none;">last seen recently</span>
        </div>
      </div>
      <div>
        <button id="new-chat-btn" class="btn-new-chat" style="display: none;">New Chat</button>
      </div>
    </header>

    <!-- Tab 1: Chats View -->
    <div id="chats-view" class="view-content active">
      <div id="character-cards-list"></div>
    </div>

    <!-- Tab 2: User Profile View -->
    <div id="profile-view" class="view-content">
      <div class="profile-container">
        <h3>My Profile</h3>
        <div class="setting-group">
          <div class="profile-avatar-wrapper">
            <img id="user-avatar-preview" src="https://via.placeholder.com/90" class="profile-avatar-preview" />
            <label class="btn-upload-photo">
              📷 Change Photo
              <input type="file" id="user-avatar-input" accept="image/*" style="display: none;" />
            </label>
          </div>
          <div>
            <label for="user-name-input">Your Name</label>
            <input type="text" id="user-name-input" placeholder="e.g. Sky" />
          </div>
          <div>
            <label for="user-about-input">✨ About You (Shared with AI)</label>
            <textarea id="user-about-input" rows="3" placeholder="Share your interests, hobbies, work, or lifestyle..."></textarea>
          </div>
          <div>
            <label for="user-gender-select">Gender</label>
            <select id="user-gender-select">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <button id="save-profile-btn" class="btn-save">Save Profile</button>
        </div>
      </div>
    </div>

    <!-- Tab 3: Settings View -->
    <div id="settings-view" class="view-content">
      <div class="settings-container">
        <h3>Settings</h3>
        <div class="setting-group">
          <label for="api-key-input">API Keys (Enter ခေါက်၍ Key များ ထည့်ပါ - Groq သို့မဟုတ် OpenRouter)</label>
          <textarea id="api-key-input" rows="4" placeholder="gsk_xxxx... (Groq Key)&#10;sk-or-v1-xxxx... (OpenRouter Key)"></textarea>
          <button id="save-key-btn" class="btn-save">Save Keys</button>
        </div>
        <div class="setting-group">
          <label for="model-select">Select Primary AI Model</label>
          <select id="model-select">
            <option value="llama-3.3-70b-versatile">Groq: Llama 3.3 70B (Roleplay အကောင်းဆုံး)</option>
            <option value="qwen/qwen3.8-27b">Groq: Qwen 3.8 27B</option>
            <option value="llama-3.1-8b-instant">Groq: Llama 3.1 8B (အမြန်ဆုံး)</option>
            <option value="meta-llama/llama-3.1-8b-instruct:free">OpenRouter: Llama 3.1 8B (Free)</option>
            <option value="google/gemini-2.0-flash-exp:free">OpenRouter: Gemini 2.0 Flash Exp (Free)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Chat Screen View -->
    <div id="chat-screen-view">
      <div id="chat-box" class="chat-box"></div>
      <footer id="input-area" class="input-area">
        <input type="text" id="chat-input" placeholder="Message..." />
        <button id="send-btn">Send</button>
      </footer>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav" id="bottom-nav">
      <div class="nav-item active" data-tab="chats-view">
        <span class="nav-icon">💬</span>
        <span>Chats</span>
      </div>
      <div class="nav-item" data-tab="profile-view">
        <span class="nav-icon">👤</span>
        <span>Profile</span>
      </div>
      <div class="nav-item" data-tab="settings-view">
        <span class="nav-icon">⚙️</span>
        <span>Settings</span>
      </div>
    </nav>
  </div>

  <script type="module" src="app.js"></script>
</body>
          </html>
